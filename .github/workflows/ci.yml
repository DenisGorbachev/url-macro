name: CI
on: [push, pull_request]

permissions:
  contents: read
  pull-requests: read

env:
  FNOX_NON_INTERACTIVE: "true"
  RUSTFLAGS: >-
    -Dwarnings
    -Clink-arg=-fuse-ld=mold
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust:
          - stable
          - beta
          - nightly
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Set home dirs
        run: |
          echo "MISE_DATA_DIR=$RUNNER_TEMP/mise" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$RUNNER_TEMP/mise/rustup" >> "$GITHUB_ENV" # RUSTUP_HOME must live under MISE_DATA_DIR, so that mise caches it automatically (it doesn't cache ~/.rustup)
          echo "CARGO_HOME=$RUNNER_TEMP/mise/cargo" >> "$GITHUB_ENV" # CARGO_HOME must live under MISE_DATA_DIR, so that mise caches it automatically (it doesn't cache ~/.cargo)
          echo "DENO_DIR=$RUNNER_TEMP/deno" >> "$GITHUB_ENV" # DENO_DIR must live outside MISE_DATA_DIR, so that actions/cache can save it after later Deno invocations
      # mold is a workaround for regression in Rust 1.93 beta
      - uses: rui314/setup-mold@9c9c13bf4c3f1adef0cc596abc155580bcb04444 # v1
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          cache_key: "{{default}}-${{ hashFiles('rust-toolchain.toml') }}"
          # cache_key must contain rust-toolchain.toml
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/deno
          key: deno-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', '*.ts', 'deno.json', '**/deno.lock') }}
          # actions/cache saves in a post-job hook, so it captures modules downloaded by later Deno invocations
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-bin: false # mise already caches CARGO_HOME
      - run: fnox --profile test ci-redact
        env:
          FNOX_AGE_KEY: ${{ secrets.FNOX_AGE_KEY }}
      - run: mise run check
        env:
          FNOX_AGE_KEY: ${{ secrets.FNOX_AGE_KEY }}
      - run: "cargo hack test --locked --workspace --feature-powerset -- --skip integration_tests::"
      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1
        with:
          failOnWarnings: true
          failOnErrors: true
